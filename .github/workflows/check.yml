name: Build Check

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The build stage runs lint, typecheck, unit tests and the production build.
      # PR checks do not upload source maps or require deployment secrets.
      - name: Build and check image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: boar-map:check
          build-args: |
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=check
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=boar-map-check
          cache-to: type=gha,mode=max,scope=boar-map-check

      - name: Check production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name boar-map-check --publish 127.0.0.1:3000:3000 boar-map:check
          trap 'docker logs boar-map-check; docker rm --force boar-map-check' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/login > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/map > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/static/leaflet.css > /dev/null
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/next16-missing-page)" = 404
