name: Deploy-prod

on:
  workflow_run:
    workflows: [Build-prod]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Notify update to production server
        shell: bash
        env:
          DEPLOY_SECRET: ${{ secrets.SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          jq -n --arg secret "$DEPLOY_SECRET" '{secret: $secret}' | curl --fail --silent --show-error --header 'Content-Type: application/json' --data-binary @- https://boar-map.gifugis.jp/cd-scripts/update.php
