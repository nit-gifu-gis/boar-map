name: Build-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKER_REGISTRY: boarmap-dev.gifu-nct.ac.jp:5000
  DOCKER_REPOSITORY: boar-map

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Update history.md
        if: ${{ contains(github.event.head_commit.message, '[meta]') }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          php .github/scripts/history.php "$COMMIT_MESSAGE"
          echo "LATEST_V=$(php .github/scripts/latest.php)" >> "$GITHUB_ENV"

      - name: Commit changes
        if: ${{ contains(github.event.head_commit.message, '[meta]') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add public/history.md
          if ! git diff --cached --quiet; then
            git commit -m ":robot: 更新履歴の追加 (Version $LATEST_V)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Create Sentry Release
        id: sentry_release
        shell: bash
        run: |
          echo "environment=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "release=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Private Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:main
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ steps.sentry_release.outputs.environment }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ steps.sentry_release.outputs.release }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=boar-map-main
          cache-to: type=gha,mode=max,scope=boar-map-main
