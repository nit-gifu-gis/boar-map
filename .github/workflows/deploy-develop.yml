name: Deploy-develop

on:
  workflow_run:
    workflows: [Build-develop]
    branches: [develop]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    steps:
      - name: Notify update to development server
        shell: bash
        env:
          DEPLOY_SECRET: ${{ secrets.SECRET_DEVELOPMENT }}
        run: |
          set -euo pipefail
          jq -n --arg secret "$DEPLOY_SECRET" '{secret: $secret}' | curl --fail --silent --show-error --header 'Content-Type: application/json' --data-binary @- https://boarmap-dev.gifu-nct.ac.jp/cd-scripts/update.php
